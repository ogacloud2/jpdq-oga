[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "jpdq-oga"
dynamic = ["version"]
description = "Data-quality checks for Japan-specific data: 法人番号, 郵便番号, 電話番号, 和暦, 全角/半角, 旧字体, 都道府県. Pure Python, Spark-native, DQX-ready."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["data-quality", "japan", "pyspark", "databricks", "dqx", "法人番号", "和暦"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Natural Language :: Japanese",
]
dependencies = []

[project.scripts]
jpdq-oga-refdata = "jpdq_oga.cli:main"

[project.optional-dependencies]
spark = ["pyspark>=3.5,<4"]
# pandas is imported by databricks-labs-dqx but not declared by it (it ships with the Databricks runtime)
excel = ["openpyxl>=3.1"]
benchmark = ["pyspark>=3.5,<4", "databricks-labs-dqx>=0.16,<0.17", "pandas>=2", "numpy>=1.26", "pyarrow>=14", "python-stdnum>=1.19"]
dqx = ["pyspark>=3.5,<4", "databricks-labs-dqx>=0.16,<0.17", "pandas>=2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "pyspark>=3.5,<4", "databricks-labs-dqx>=0.16,<0.17", "pandas>=2", "openpyxl>=3.1", "numpy>=1.26", "pyarrow>=14", "python-stdnum>=1.19"]

[tool.hatch.version]
path = "src/jpdq_oga/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jpdq_oga"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --cov=jpdq_oga --cov-report=term-missing"
markers = [
  "spark: tests that need a local Spark session (JDK 17 required)",
  "dqx: tests that need databricks-labs-dqx",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["pyspark.*", "databricks.*", "openpyxl.*", "stdnum.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["jpdq_oga"]

[tool.coverage.report]
fail_under = 90
show_missing = true