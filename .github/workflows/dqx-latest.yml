name: DQX latest

# Weekly early warning: this package uses DQX internals (make_condition, register_rule, ...) and pins
# databricks-labs-dqx>=0.16,<0.17. This job runs the suite against the newest DQX release to show, before a
# user does, when a DQX update breaks the checks. A red run means "look at it", not "the package is broken".
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  test-latest-dqx:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install (newest DQX over the locked one)
        run: |
          uv sync --extra dev --python 3.12
          uv pip install --upgrade databricks-labs-dqx
          uv pip list | grep -i -E "databricks-labs-dqx|pyspark"
      - name: Test against the newest DQX
        run: uv run --no-sync pytest -q -o addopts="-p no:cacheprovider"
