name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: uv sync --extra dev --python ${{ matrix.python-version }}
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test (coverage must stay >= 90%)
        run: uv run pytest -q

  # Databricks Runtime 17+ ships Spark 4.x: run the whole suite against PySpark 4.0 as well
  test-spark4:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install (PySpark 4.0 over the locked 3.5)
        run: |
          uv sync --extra dev --python 3.12
          uv pip install "pyspark==4.0.0"
      - name: Test on Spark 4.0
        run: uv run --no-sync pytest -q -o addopts="-p no:cacheprovider"

  # Great Expectations adapter (jpdq_oga.gx_expectations): pandas and Spark engines
  test-gx:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: uv sync --extra dev --extra gx --python 3.12
      - name: Test the GX adapter
        run: uv run pytest -q -o addopts="-p no:cacheprovider" tests/test_gx.py
